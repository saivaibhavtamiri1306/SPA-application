<div class="page-pad route-in"><div style="margin-bottom:20px"><div class="kicker">OPERATOR WORKFLOW</div><h1 class="title">Verification <span>Pipeline</span></h1><p class="sub">Drag a candidate card to the next verification stage. Changes are persisted through the online API.</p></div><section class="kanban"><div class="glass column" *ngFor="let stage of stages;let i=index" (dragover)="allow($event)" (drop)="drop($event,i)"><h4>{{stage}} <span style="float:right;color:#64748b">{{byStage(i).length}}</span></h4><div class="dropzone"><article class="candidate-card" *ngFor="let c of byStage(i)" draggable="true" (dragstart)="drag(c)"><div class="candidate-name"><span>{{c.name}}</span><span class="cyan">{{c.score}}%</span></div><div class="candidate-role">{{c.role}}</div><div class="progress"><i [style.width.%]="c.score"></i></div><div class="mono muted" style="font-size:8px;margin-top:8px">{{c.id}}</div></article><div class="empty" *ngIf="!byStage(i).length">Drop candidates here</div></div></div></section></div>
