<div class="tv-page"><tv-three-background></tv-three-background><div class="tv-grid"></div>
  <aside class="sidebar glass"><div class="brand"><div class="brand-mark">🛡</div><div class="brand-copy"><b>TRUST<span style="color:#22d3ee">VAULT</span></b><small>SECURE VERIFICATION</small></div></div><nav class="nav-list"><ng-container *ngFor="let n of nav"><a *ngIf="visible(n[0])" [routerLink]="n[0]" routerLinkActive="active" class="nav-btn"><span style="font-size:16px;width:30px;text-align:center">{{n[1]}}</span><span class="nav-label">{{title(n[2])}}</span></a></ng-container></nav><button class="nav-btn" (click)="logout()" style="color:#ff6685"><span style="font-size:16px;width:30px;text-align:center">↪</span><span class="nav-label">{{title('logout')}}</span></button></aside>
  <header class="topbar glass"><div><span class="kicker">{{auth.user?.role}}</span><span class="mono muted" style="font-size:9px;margin-left:12px">LIVE CONTROL PLANE</span></div><div class="top-right"><button class="pill" type="button" (click)="toggleOffline()" [class.offline]="api.isOfflineSimulation">● {{api.isOfflineSimulation?'OFFLINE DEMO':'SERVER UP'}}</button><select class="pill" [value]="i18n.lang()" (change)="i18n.setLang($any($event.target).value)"><option value="en">EN</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select><span class="pill">● ENCRYPTED CONNECTION</span><span class="pill">{{auth.user?.name}}</span></div></header>
  <main class="main-shell"><router-outlet></router-outlet></main>
</div>
