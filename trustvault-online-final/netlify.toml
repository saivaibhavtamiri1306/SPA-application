[build]
  command = "npm install --no-audit --no-fund && cd frontend && npm install --no-audit --no-fund && npm run build"
  publish = "frontend/dist/trustvault-core/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.19.0"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "cd frontend && npm start"
  targetPort = 4200
  port = 8888
