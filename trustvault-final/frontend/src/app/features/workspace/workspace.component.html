<div class="workspace-root"><tv-scene/><div class="noise-overlay"></div><aside class="side-rail" [class.expanded]="false"><div class="side-brand"><div class="brand-mark">⌬</div><div><b>TRUST<span>VAULT</span></b><small>CORE CONTROL</small></div></div><nav><a *ngFor="let n of nav" [class.hidden]="n.admin && user.role!=='Admin'" [class.active]="active===n.path" [routerLink]="['/workspace',n.path]"><i>{{n.icon}}</i><span>{{t(n.label)}}</span><em *ngIf="n.admin">ADMIN</em></a></nav><div class="side-bottom"><button type="button" class="terminate" (click)="logout()"><i>↪</i><span>{{t('logout')}}</span></button></div></aside>
<main class="workspace-main"><header class="topbar"><div class="breadcrumb"><span>TRUSTVAULT</span><b>/</b><strong>{{active | uppercase}}</strong></div><div class="top-actions"><button class="server-pill" [class.down]="offline" (click)="toggleServer()"><i></i>{{offline?'SERVER DOWN':'SERVER UP'}}</button><select aria-label="Language" [value]="i18n.language" (change)="setLang($any($event.target).value)"><option value="en">English</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select><div class="connection"><i></i>{{offline?'OFFLINE MODE · CACHE':'ENCRYPTED CONNECTION'}}</div><div class="avatar"><span>{{user.name.charAt(0)}}</span><div><b>{{user.name}}</b><small>{{user.role}} · {{user.accessLevel}}</small></div></div></div></header><div class="idle-lock" *ngIf="idleSeconds>0">⚠ INACTIVE SESSION — AUTO-LOCK IN {{idleSeconds}}s</div><section class="workspace-content"><router-outlet /></section></main><tv-toast/></div>
